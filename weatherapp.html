<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="weather.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins"
      rel="stylesheet"
    />
    <title>Weather</title>
  </head>

  <body>
    <div class="container">
      <div class="condition">
        <span class="heads">Weather app</span>
        <hr />
        <br />
        <div class="places-div">
          <span class="places-span">
            <i class="fa-solid fa-magnifying-glass fa-sm"></i>
            <input type="text" id="places" placeholder="Search for a city..." />
          </span>
        </div>
        <br />
        <div id="output"></div>
      </div>
    </div>
    <script src="weather.js"></script>
    <script
      src="https://kit.fontawesome.com/29379f6b64.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
